name: Trigger Unified Preview

on:
  push:
    branches: [unified-ui]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger preview repository deployment
        env:
          PREVIEW_TOKEN: ${{ secrets.UNIFIED_PREVIEW_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${PREVIEW_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ccosse/d3SRT-unified/actions/workflows/deploy-preview.yml/dispatches \
            -d '{"ref":"main"}'
